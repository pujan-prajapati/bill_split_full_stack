services:
  db:
    image: postgres:17-alpine
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bill_split

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.docker
    depends_on:
      - db
    volumes:
      - ./backend/static:/app/static
      - ./backend/media:/app/media
    networks:
      - bill_split
    command: >
      sh -c "
            uv run python manage.py migrate &&
            uv run python manage.py collectstatic --noinput &&
            uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 180
      "

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
        VITE_IMAGE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - bill_split

volumes:
  postgres_data:

networks:
  bill_split:
